<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字世界地图</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
  header h1 { font-size: 28px; margin-bottom: 8px; }
  header p { opacity: 0.8; font-size: 14px; }
  #tree { width: 100%; height: 600px; background: white; margin: 20px auto; max-width: 1000px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .node circle { cursor: pointer; }
  .node text { font-size: 14px; }
  .link { fill: none; stroke: #ccc; stroke-width: 2px; }
</style>
</head>
<body>
<header>
  <h1>🗺️ 数字世界地图</h1>
  <p>我的数字世界大纲 · 点击节点进入子页面</p>
</header>

<div id="tree"></div>

<script>
const data = {
  name: "数字世界",
  desc: "我的数字世界大纲，所有项目、数据、规则的总入口。",
  children: [
    {
      name: "炒菜鸡",
      desc: "苏泊尔小C主厨机菜谱站",
      url: "/Chaocaiji/",
      rules: [
        "只用 Lidl/Prisma 能买到的食材",
        "备菜极简，切了直接下锅",
        "酱料 3-5 种封顶",
        "好吃优先，一锅出优先但避重油"
      ],
      dataFiles: [
        "网站源码：~/workspace/chaocaiji-site/",
        "GitHub 仓库：otwoyang/Chaocaiji",
        "线上地址：https://otwoyang.github.io/Chaocaiji/"
      ]
    },
    {
      name: "Notes",
      desc: "个人笔记系统（Memos），记录日常与工作",
      rules: [
        "用 ## 标签分类",
        "重要事项打 #todo",
        "Muse 可读写，自动整理"
      ],
      dataFiles: [
        "数据库：~/workspace/memos/data/memos_prod.db (SQLite)",
        "Mac 备份：~/Documents/Project-Notes/Data/memos_prod.db",
        "共 70 条笔记"
      ]
    }
  ]
};

const width = 1000, height = 600;
const svg = d3.select("#tree").append("svg")
  .attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", "translate(80,0)");

const tree = d3.tree().size([height - 40, width - 250]);
const root = d3.hierarchy(data);
tree(root);

g.selectAll(".link")
  .data(root.links()).enter().append("path")
  .attr("class", "link")
  .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

const node = g.selectAll(".node")
  .data(root.descendants()).enter().append("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.y},${d.x})`)
  .on("click", (event, d) => {
    if (d.data.url) window.location.href = d.data.url;
  });

node.append("circle")
  .attr("r", d => d.depth === 0 ? 12 : 8)
  .attr("fill", d => d.depth === 0 ? "#e74c3c" : "#3498db");

node.append("text")
  .attr("dy", ".35em")
  .attr("x", d => d.children ? -16 : 16)
  .attr("text-anchor", d => d.children ? "end" : "start")
  .text(d => d.data.name);

</script>
</body>
</html>
