<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital World Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; }
  header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
  header h1 { font-size: 28px; margin-bottom: 8px; }
  header p { opacity: 0.8; font-size: 14px; }
  #tree { width: 100%; height: 600px; background: white; margin: 20px auto; max-width: 1000px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .node circle { cursor: pointer; }
  .node text { font-size: 14px; }
  .link { fill: none; stroke: #ccc; stroke-width: 2px; }
</style>
</head>
<body>
<header>
  <h1>🗺️ Digital World Map</h1>
  <p>Click a node to enter its page</p>
</header>

<div id="tree"></div>

<script>
const data = {
  name: "",
  children: [
    {
      name: "Notes",
      url: "/notes/"
    },
    {
      name: "Work",
      children: []
    },
    {
      name: "Life",
      children: [
        {
          name: "Food",
          children: [
            {
              name: "Chaocaiji",
              url: "/Chaocaiji/"
            }
          ]
        }
      ]
    }
  ]
};

const width = 1000, height = 600;
const svg = d3.select("#tree").append("svg")
  .attr("width", width).attr("height", height);
const g = svg.append("g").attr("transform", "translate(80,0)");

const tree = d3.tree().size([height - 40, width - 250]);
const root = d3.hierarchy(data);
tree(root);

g.selectAll(".link")
  .data(root.links().filter(d => d.source.depth > 0)).enter().append("path")
  .attr("class", "link")
  .attr("d", d => {
    const s = {x: d.source.x, y: (d.source.depth - 1) * 200};
    const t = {x: d.target.x, y: (d.target.depth - 1) * 200};
    return `M${s.y},${s.x}C${(s.y + t.y) / 2},${s.x} ${(s.y + t.y) / 2},${t.x} ${t.y},${t.x}`;
  });

const node = g.selectAll(".node")
  .data(root.descendants().filter(d => d.depth > 0)).enter().append("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${(d.depth - 1) * 200},${d.x})`)
  .on("click", (event, d) => {
    if (d.data.url) window.location.href = d.data.url;
  });

node.append("circle")
  .attr("r", d => d.depth === 1 ? 10 : 8)
  .attr("fill", d => d.depth === 1 ? "#e74c3c" : "#3498db");

node.append("text")
  .attr("dy", ".35em")
  .attr("x", d => d.children ? -16 : 16)
  .attr("text-anchor", d => d.children ? "end" : "start")
  .text(d => d.data.name);

</script>
</body>
</html>
