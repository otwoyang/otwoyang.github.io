<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", monospace; background: #f5f5f5; color: #333; padding: 40px 20px; }
  main { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size: 22px; margin-bottom: 24px; }
  .tree { font-size: 17px; line-height: 2.2; }
  .tree ul { list-style: none; padding-left: 28px; }
  .tree > ul { padding-left: 0; }
  .tree li { position: relative; }
  .tree li::before { content: "└── "; color: #999; }
  .tree > ul > li::before { content: ""; }
  .tree a { color: #1a73e8; text-decoration: none; }
  .tree a:hover { text-decoration: underline; }
  .cat { color: #333; font-weight: 500; }
  .arrow { color: #999; margin: 0 6px; }
</style>
</head>
<body>
<main>
  <h1>🗺️ Map</h1>
  <div class="tree">
    <ul>
      <li><a href="/notes/">Notes</a></li>
      <li><span class="cat">Work</span>
        <ul>
          <li><span class="cat">Sales</span>
            <ul>
              <li><a href="/sales/kitchen/">APP-Kitchen</a></li>
              <li><a href="/sales/app-sales/">APP-Sales</a></li>
            </ul>
          </li>
        </ul>
      </li>
      <li><span class="cat">Life</span>
        <ul>
          <li><span class="cat">Food</span>
            <ul>
              <li><a href="/Chaocaiji/">Chaocaiji</a></li>
            </ul>
          </li>
          <li><span class="cat">Digital</span>
            <ul>
              <li><span class="cat">Hardware</span>
                <ul>
                  <li><a href="/mac-mini/">Mac mini</a></li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</main>
</body>
</html>
