<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMAMI 网页播放器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #050505; color: #FFFFFF; font-family: sans-serif; }
  body { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }
  h1 { font-size: 26px; line-height: 36px; font-weight: bold; margin: 8px 0 4px; }
  h1 .mark { color: #20FF2F; }
  .hint { color: #B8B8B8; font-size: 14px; line-height: 22px; margin: 8px 0 16px; }
  .status { color: #20FF2F; font-size: 14px; line-height: 22px; margin: 8px 0 16px; word-break: break-all; }
  .panel { background: #171717; padding: 16px; margin-bottom: 16px; }
  .folder-name { color: #B8B8B8; font-size: 14px; line-height: 22px; word-break: break-all; margin-bottom: 16px; }
  .folder-name b { color: #FFFFFF; }
  button {
    display: block; width: 100%; min-height: 56px;
    background: #171717; color: #FFFFFF; border: 2px solid #20FF2F;
    font-size: 20px; line-height: 28px; font-weight: bold;
    border-radius: 0; cursor: pointer; margin-bottom: 12px;
  }
  button:active { background: #248C22; }
  button.primary { background: #248C22; border-color: #248C22; }
  .now { font-size: 18px; line-height: 28px; word-break: break-all; margin-bottom: 4px; }
  .now .mark { color: #20FF2F; }
  .time { color: #B8B8B8; font-size: 14px; line-height: 20px; margin-bottom: 8px; }
  input[type="range"] { width: 100%; height: 32px; accent-color: #20FF2F; }
  .row { display: flex; gap: 12px; margin-top: 12px; }
  .row button { flex: 1; margin-bottom: 0; }
  .vol-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .vol-row span { color: #B8B8B8; font-size: 16px; white-space: nowrap; }
  .vol-row input { flex: 1; }
  #playlist { list-style: none; }
  #playlist li {
    padding: 12px 8px; border-bottom: 1px solid #171717;
    font-size: 16px; line-height: 24px; word-break: break-all; cursor: pointer;
  }
  #playlist li.current { color: #20FF2F; background: #171717; }
  .empty { color: #B8B8B8; font-size: 16px; line-height: 24px; padding: 12px 8px; }
</style>
</head>
<body>
  <h1><span class="mark">&gt;</span> UMAMI 网页播放器</h1>
  <p class="hint" id="hint">第一次点下面选一次 Music 文件夹和 Radio 文件夹，选完就记住了；以后打开网址会自动播。</p>
  <p class="status" id="autoStatus" hidden></p>

  <div id="fsaBox" hidden>
    <button id="pickMusicBtn" type="button">选择 Music 文件夹</button>
    <button id="pickRadioBtn" type="button">选择 Radio 文件夹</button>
    <p class="folder-name" id="storedInfo"></p>
  </div>
  <button id="authBtn" type="button" hidden>点一下授权并播放</button>

  <button id="pickBtn" class="primary" type="button">&gt; 选择文件夹</button>
  <input type="file" id="folderInput" webkitdirectory multiple hidden>
  <p class="folder-name" id="folderInfo">还没有选文件夹。</p>

  <div class="panel">
    <p class="now" id="nowPlaying"><span class="mark">&gt;</span> 未在播放</p>
    <p class="time"><span id="curTime">00:00</span> / <span id="totTime">00:00</span></p>
    <input type="range" id="seekBar" min="0" max="1000" value="0" aria-label="播放进度">
    <div class="row">
      <button id="prevBtn" type="button">上一首</button>
      <button id="playBtn" type="button">播放</button>
      <button id="nextBtn" type="button">下一首</button>
    </div>
    <div class="vol-row">
      <span>音量</span>
      <input type="range" id="volBar" min="0" max="100" value="100" aria-label="音量">
    </div>
  </div>

  <div class="panel">
    <ul id="playlist"><li class="empty">歌单是空的，先选文件夹。</li></ul>
  </div>

  <audio id="audio" preload="metadata"></audio>

<script>
(function () {
  'use strict';
  var AUDIO_EXTS = ['mp3', 'wav', 'm4a', 'flac', 'ogg', 'opus'];
  var audio = document.getElementById('audio');
  var folderInput = document.getElementById('folderInput');
  var pickBtn = document.getElementById('pickBtn');
  var playBtn = document.getElementById('playBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var seekBar = document.getElementById('seekBar');
  var volBar = document.getElementById('volBar');
  var nowPlaying = document.getElementById('nowPlaying');
  var curTimeEl = document.getElementById('curTime');
  var totTimeEl = document.getElementById('totTime');
  var folderInfo = document.getElementById('folderInfo');
  var playlistEl = document.getElementById('playlist');
  var hintEl = document.getElementById('hint');
  var autoStatusEl = document.getElementById('autoStatus');
  var fsaBox = document.getElementById('fsaBox');
  var pickMusicBtn = document.getElementById('pickMusicBtn');
  var pickRadioBtn = document.getElementById('pickRadioBtn');
  var storedInfo = document.getElementById('storedInfo');
  var authBtn = document.getElementById('authBtn');

  var tracks = [];   // {name, rel, url}
  var current = -1;
  var seeking = false;
  var pendingAuto = null; // {kind:'music'} 或 {kind:'radio', date:'YYYY-MM-DD'}，授权重试用

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    sec = Math.floor(sec);
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return (m < 10 ? '0' + m : '' + m) + ':' + (s < 10 ? '0' + s : '' + s);
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function isAudio(name) {
    var dot = name.lastIndexOf('.');
    if (dot < 0) return false;
    return AUDIO_EXTS.indexOf(name.slice(dot + 1).toLowerCase()) >= 0;
  }

  function setAutoStatus(msg) {
    if (!autoStatusEl) return;
    autoStatusEl.hidden = false;
    autoStatusEl.textContent = msg;
  }

  function setMediaSession(track) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.name,
        artist: track.rel,
        album: 'UMAMI 网页播放器'
      });
    } catch (e) { /* 旧浏览器没有 MediaMetadata，跳过 */ }
  }

  function bindMediaSessionActions() {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.setActionHandler('play', function () { playCurrent(); });
      navigator.mediaSession.setActionHandler('pause', function () { pauseCurrent(); });
      navigator.mediaSession.setActionHandler('previoustrack', function () { playPrev(); });
      navigator.mediaSession.setActionHandler('nexttrack', function () { playNext(); });
      navigator.mediaSession.setActionHandler('seekto', function (d) {
        if (d && typeof d.seekTime === 'number') audio.currentTime = d.seekTime;
      });
    } catch (e) { /* 不支持的动作直接跳过 */ }
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    if (!tracks.length) {
      var li0 = document.createElement('li');
      li0.className = 'empty';
      li0.textContent = '歌单是空的，先选文件夹。';
      playlistEl.appendChild(li0);
      return;
    }
    tracks.forEach(function (t, i) {
      var li = document.createElement('li');
      li.textContent = (i === current ? '> ' : '') + t.rel;
      if (i === current) li.className = 'current';
      li.addEventListener('click', function () { playIndex(i); });
      playlistEl.appendChild(li);
    });
  }

  function showCurrent() {
    if (current < 0 || !tracks[current]) {
      nowPlaying.innerHTML = '<span class="mark">&gt;</span> 未在播放';
      return;
    }
    var t = tracks[current];
    nowPlaying.innerHTML = '<span class="mark">&gt;</span> ' + escapeHtml(t.rel);
    setMediaSession(t);
    renderPlaylist();
  }

  // 播放：接住自动播放被浏览器拦住的情况（没有用户手势 / MEI 不够），
  // 不抛未捕获的 Promise 拒绝，改显示提示让用户点一下“播放”。
  function tryPlay() {
    var p = null;
    try { p = audio.play(); } catch (e) { p = null; }
    if (p && typeof p.catch === 'function') {
      p.catch(function () {
        setAutoStatus('浏览器拦住了自动播放，点一下“播放”就开始。');
        playBtn.textContent = '播放';
      });
    }
  }

  function playIndex(i) {
    if (i < 0 || i >= tracks.length) return;
    current = i;
    audio.src = tracks[i].url;
    tryPlay();
    playBtn.textContent = '暂停';
    showCurrent();
  }

  function playCurrent() {
    if (!tracks.length) return;
    if (current < 0) { playIndex(0); return; }
    tryPlay();
    playBtn.textContent = '暂停';
  }

  function pauseCurrent() {
    audio.pause();
    playBtn.textContent = '播放';
  }

  function playNext() {
    if (!tracks.length) return;
    if (current < tracks.length - 1) playIndex(current + 1);
    else playIndex(0); // 循环
  }

  function playPrev() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (current > 0) playIndex(current - 1);
  }

  pickBtn.addEventListener('click', function () { folderInput.click(); });

  folderInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(folderInput.files || []);
    tracks.forEach(function (t) { URL.revokeObjectURL(t.url); });
    tracks = [];
    files.forEach(function (f) {
      if (!isAudio(f.name)) return;
      var rel = f.webkitRelativePath || f.name;
      tracks.push({ name: f.name, rel: rel, url: URL.createObjectURL(f) });
    });
    tracks.sort(function (a, b) {
      var x = a.rel.toLowerCase(), y = b.rel.toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    });
    current = -1;
    if (!tracks.length) {
      folderInfo.textContent = '这个文件夹里没有找到音频文件，请换一个文件夹。';
      renderPlaylist();
      return;
    }
    var top = tracks[0].rel.split('/')[0];
    folderInfo.innerHTML = '文件夹：<b>' + escapeHtml(top) + '</b>，共 ' + tracks.length + ' 首。';
    renderPlaylist();
    playIndex(0); // 选文件夹这个手势本身就是用户操作，直接开始播第一首
  });

  playBtn.addEventListener('click', function () {
    if (!tracks.length) return;
    if (audio.paused) playCurrent(); else pauseCurrent();
  });
  prevBtn.addEventListener('click', playPrev);
  nextBtn.addEventListener('click', playNext);

  audio.addEventListener('ended', function () {
    if (!tracks.length) return;
    if (current < tracks.length - 1) playIndex(current + 1);
    else playIndex(0); // 播完循环回第一首
  });
  audio.addEventListener('play', function () { playBtn.textContent = '暂停'; });
  audio.addEventListener('pause', function () { playBtn.textContent = '播放'; });
  audio.addEventListener('loadedmetadata', function () {
    totTimeEl.textContent = fmt(audio.duration);
  });
  audio.addEventListener('timeupdate', function () {
    curTimeEl.textContent = fmt(audio.currentTime);
    if (!seeking && audio.duration) {
      seekBar.value = Math.round(audio.currentTime / audio.duration * 1000);
    }
  });
  seekBar.addEventListener('input', function () {
    seeking = true;
    if (audio.duration) audio.currentTime = seekBar.value / 1000 * audio.duration;
  });
  seekBar.addEventListener('change', function () { seeking = false; });
  volBar.addEventListener('input', function () {
    audio.volume = volBar.value / 100;
  });

  // ====== URL 参数自动播 (?auto=music / ?auto=radio / ?auto=stop / ?auto=next) ======
  function getParam(name) {
    try { return new URLSearchParams(location.search).get(name); } catch (e) { return null; }
  }

  function todayStr() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : '' + m) + '-' + (day < 10 ? '0' + day : '' + day);
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // 跨标签页命令：stop/next 由 Tasker 打开一个新标签页发指令，
  // 正在播的那个标签页收到后执行。BroadcastChannel + localStorage 双通道。
  var bc = null;
  try { bc = new BroadcastChannel('umami-player'); } catch (e) { bc = null; }

  function sendCommand(cmd) {
    var msg = { cmd: cmd, t: Date.now() };
    try { if (bc) bc.postMessage(msg); } catch (e) {}
    try { localStorage.setItem('umami-cmd', JSON.stringify(msg)); } catch (e) {}
  }

  function onRemoteCommand(cmd) {
    if (cmd === 'stop') { pauseCurrent(); setAutoStatus('已暂停。'); }
    else if (cmd === 'next') {
      if (tracks.length) { playNext(); setAutoStatus('已切下一首。'); }
    }
  }

  if (bc) {
    bc.onmessage = function (ev) {
      if (ev && ev.data && ev.data.cmd) onRemoteCommand(ev.data.cmd);
    };
  }
  window.addEventListener('storage', function (ev) {
    if (ev.key !== 'umami-cmd' || !ev.newValue) return;
    try {
      var m = JSON.parse(ev.newValue);
      if (m && m.cmd) onRemoteCommand(m.cmd);
    } catch (e) {}
  });

  // ====== IndexedDB：存目录 handle（File System Access API） ======
  // handle 另外缓存在内存里（cachedHandles），因为 requestPermission 必须在
  // 用户手势里同步调用——授权按钮一点就先要权限，不能先 await 读库，
  // 否则手势过期、权限要不到，页面就一直卡在“重新授权”。
  var cachedHandles = { music: null, radio: null };

  function refreshCachedHandles() {
    return Promise.all([
      idbGet('music').catch(function () { return null; }),
      idbGet('radio').catch(function () { return null; })
    ]).then(function (res) {
      cachedHandles.music = res[0];
      cachedHandles.radio = res[1];
    });
  }

  var DB_NAME = 'umami-player';
  var STORE = 'handles';

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function idbPut(key, val) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        var req = tx.objectStore(STORE).put(val, key);
        req.onsuccess = function () { resolve(); };
        req.onerror = function () { reject(req.error); };
      });
    });
  }

  function hasFSA() {
    return typeof window.showDirectoryPicker === 'function';
  }

  // 读权限：granted 直接读；prompt 试着要一次（无手势时可能要不到，返回 prompt 后走授权按钮）；
  // denied / 异常一律回退到让用户重选。
  async function ensureReadPermission(handle) {
    if (!handle || typeof handle.queryPermission !== 'function') return 'denied';
    try {
      var st = await handle.queryPermission({ mode: 'read' });
      if (st === 'granted') return 'granted';
      if (st === 'prompt') {
        try {
          var st2 = await handle.requestPermission({ mode: 'read' });
          return st2;
        } catch (e) { return 'prompt'; }
      }
      return st;
    } catch (e) { return 'denied'; }
  }

  // 读目录里的音频：flattenOne=true 时再扁平化读一层子文件夹（Music 与 App 行为一致）
  async function collectAudio(dirHandle, flattenOne) {
    var out = [];
    for await (var entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        if (isAudio(entry.name)) {
          var f = await entry.getFile();
          out.push({ name: entry.name, rel: entry.name, file: f });
        }
      } else if (entry.kind === 'directory' && flattenOne) {
        for await (var sub of entry.values()) {
          if (sub.kind === 'file' && isAudio(sub.name)) {
            var f2 = await sub.getFile();
            out.push({ name: sub.name, rel: entry.name + '/' + sub.name, file: f2 });
          }
        }
      }
    }
    return out;
  }

  function tracksFromFiles(list) {
    tracks.forEach(function (t) { URL.revokeObjectURL(t.url); });
    tracks = list.map(function (it) {
      return { name: it.name, rel: it.rel, url: URL.createObjectURL(it.file) };
    });
  }

  function showAuthButton(kind, dateStr) {
    pendingAuto = { kind: kind, date: dateStr || null };
    if (authBtn) authBtn.hidden = false;
  }

  // 授权按钮：点一下 = 在手势里直接要权限 + 接着播。
  // 关键：requestPermission 必须是手势里第一个调用，不能先 await 读库或别的，
  // 否则手势过期、系统权限框弹不出来，页面就死循环回“重新授权”。
  if (authBtn) authBtn.addEventListener('click', async function () {
    authBtn.hidden = true;
    var p = pendingAuto; pendingAuto = null;
    if (!p) return;
    var handle = cachedHandles[p.kind];
    if (handle && typeof handle.requestPermission === 'function') {
      try {
        var st = await handle.requestPermission({ mode: 'read' });
        if (st !== 'granted') {
          setAutoStatus('没有拿到文件夹授权，请再点一次“点一下授权并播放”。');
          showAuthButton(p.kind, p.date);
          return;
        }
      } catch (e) {
        setAutoStatus('授权失败，请再点一次“点一下授权并播放”。');
        showAuthButton(p.kind, p.date);
        return;
      }
    }
    if (p.kind === 'music') loadMusicAuto();
    else if (p.kind === 'radio') loadRadioAuto(p.date || todayStr());
  });

  async function loadMusicAuto() {
    setAutoStatus('正在读取 Music 文件夹…');
    var handle = cachedHandles.music;
    if (!handle) {
      try { handle = await idbGet('music'); } catch (e) { handle = null; }
      if (handle) cachedHandles.music = handle;
    }
    if (!handle) {
      setAutoStatus('还没有选过 Music 文件夹，请点下面的按钮选一次，选完就记住了。');
      return;
    }
    var perm = await ensureReadPermission(handle);
    if (perm !== 'granted') {
      setAutoStatus('Music 文件夹需要重新授权，请点“点一下授权并播放”。');
      showAuthButton('music');
      return;
    }
    var list = await collectAudio(handle, true);
    if (!list.length) {
      setAutoStatus('Music 文件夹里没有找到音频文件，请重选一次。');
      return;
    }
    list.sort(function (a, b) {
      var x = a.rel.toLowerCase(), y = b.rel.toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    });
    shuffle(list);
    tracksFromFiles(list);
    current = -1;
    folderInfo.innerHTML = '文件夹：<b>Music</b>，共 ' + tracks.length + ' 首（乱序循环）。';
    renderPlaylist();
    playIndex(0);
    setAutoStatus('正在播放 Music（乱序循环）。');
  }

  async function loadRadioAuto(dateStr) {
    setAutoStatus('正在读取 ' + dateStr + ' 的电台…');
    var handle = cachedHandles.radio;
    if (!handle) {
      try { handle = await idbGet('radio'); } catch (e) { handle = null; }
      if (handle) cachedHandles.radio = handle;
    }
    if (!handle) {
      setAutoStatus('还没有选过 Radio 文件夹，请点下面的按钮选一次，选完就记住了。');
      return;
    }
    var perm = await ensureReadPermission(handle);
    if (perm !== 'granted') {
      setAutoStatus('Radio 文件夹需要重新授权，请点“点一下授权并播放”。');
      showAuthButton('radio', dateStr);
      return;
    }
    var dayDir = null;
    try {
      var d1 = await handle.getDirectoryHandle(dateStr);
      dayDir = await d1.getDirectoryHandle(dateStr);
    } catch (e) { dayDir = null; }
    if (!dayDir) {
      setAutoStatus(dateStr + ' 还没有电台节目。');
      return;
    }
    var list = await collectAudio(dayDir, false);
    if (!list.length) {
      setAutoStatus(dateStr + ' 的电台文件夹是空的。');
      return;
    }
    list.sort(function (a, b) {
      var x = a.rel.toLowerCase(), y = b.rel.toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    });
    tracksFromFiles(list);
    current = -1;
    folderInfo.innerHTML = '文件夹：<b>Radio/' + dateStr + '</b>，共 ' + tracks.length + ' 首（按顺序循环）。';
    renderPlaylist();
    playIndex(0);
    setAutoStatus('正在播放 ' + dateStr + ' 的电台（按顺序循环）。');
  }

  async function pickFolder(kind) {
    if (!hasFSA()) return;
    var id = kind === 'music' ? 'umami-music' : 'umami-radio';
    try {
      var handle = await window.showDirectoryPicker({ id: id, mode: 'read' });
      await idbPut(kind, handle);
      cachedHandles[kind] = handle;
      updateStoredInfo();
      setAutoStatus((kind === 'music' ? 'Music' : 'Radio') + ' 文件夹已记住：' + handle.name + '。以后打开网址会自动播。');
    } catch (e) {
      if (e && e.name === 'AbortError') return; // 用户取消选择
      setAutoStatus('选择文件夹失败：' + (e && e.message ? e.message : String(e)));
    }
  }

  function updateStoredInfo() {
    if (!storedInfo) return;
    Promise.all([
      idbGet('music').catch(function () { return null; }),
      idbGet('radio').catch(function () { return null; })
    ]).then(function (res) {
      var m = res[0], r = res[1];
      storedInfo.textContent =
        'Music：' + (m ? '已记住（' + (m.name || '') + '）' : '未选择') +
        '；Radio：' + (r ? '已记住（' + (r.name || '') + '）' : '未选择') + '。';
    });
  }

  if (pickMusicBtn) pickMusicBtn.addEventListener('click', function () { pickFolder('music'); });
  if (pickRadioBtn) pickRadioBtn.addEventListener('click', function () { pickFolder('radio'); });

  // 界面按能力切换：支持 File System Access 就用两个记住式按钮，
  // 不支持就退回原来的手动“选择文件夹”（每次打开都要重选）。
  if (hasFSA()) {
    if (fsaBox) fsaBox.hidden = false;
    if (pickBtn) pickBtn.hidden = true;
    if (hintEl) hintEl.textContent = '第一次点下面选一次 Music 文件夹和 Radio 文件夹，选完就记住了；以后打开网址会自动播。';
    updateStoredInfo();
    refreshCachedHandles();
  } else {
    if (fsaBox) fsaBox.hidden = true;
    if (pickBtn) pickBtn.hidden = false;
    if (hintEl) hintEl.textContent = '这个浏览器不支持自动记住文件夹，每次打开都要点「选择文件夹」手动选一次。';
  }

  bindMediaSessionActions();
  renderPlaylist();

  // 打开网址即自动播（编号入口：001=音乐，002=电台，003=停止，004=下一首；
  // ?auto=music/radio/stop/next 仍可用，是同一入口的别名）
  (function autoRun() {
    var mode = getParam('auto');
    var go = getParam('go');
    if (go) {
      var map = { '001': 'music', '002': 'radio', '003': 'stop', '004': 'next' };
      mode = map[go] || mode;
    }
    if (!mode) return;
    if (mode === 'stop' || mode === 'next') {
      sendCommand(mode);
      setAutoStatus(mode === 'stop'
        ? '已发送“暂停”指令（播放器须在另一个标签页开着）。'
        : '已发送“下一首”指令（播放器须在另一个标签页开着）。');
      return;
    }
    if (mode === 'music') { loadMusicAuto(); return; }
    if (mode === 'radio') {
      var ds = getParam('date');
      if (!ds || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) ds = todayStr();
      loadRadioAuto(ds);
      return;
    }
    // 未知 auto 值：当作手动模式，不做任何事
  })();
})();
</script>
</body>
</html>
