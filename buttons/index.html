<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buttons</title>
<style>
  :root { --scale: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: monospace; background: #f5f5f5; color: #333; overflow: hidden; }
  .page { height: 100dvh; max-width: 1100px; margin: 0 auto; padding: 10px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(18px, 2.4vw, 24px); }
  .legend { font-size: clamp(11px, 1.4vw, 13px); color: #666; }
  .legend b.done { color: #1a73e8; }
  .legend b.todo { color: #999; }
  .scale { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: clamp(11px, 1.4vw, 13px); white-space: nowrap; }
  .scale input { width: clamp(90px, 14vw, 150px); }
  .groups { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
  .group { background: #fff; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .group h2 { font-size: clamp(13px, 1.7vw, 17px); }
  .btns { flex: 1; min-height: 0; display: grid; gap: 6px; }
  .g-trip .btns { display: flex; flex-direction: column; gap: 6px; }
  .g-trip .btn.go { width: 100%; flex: 0 0 auto; }
  .brow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .brow .rowlabel { font-size: calc(clamp(12px, 1.6vw, 17px) * var(--scale)); color: #666; flex: 0 0 auto; }
  .chip { font-family: monospace; font-size: calc(clamp(11px, 1.4vw, 15px) * var(--scale)); line-height: 1.2; border: none; border-radius: 8px; padding: 5px 7px; cursor: pointer; background: #dbe7f7; color: #3367b0; }
  .chip.sel { background: #1a73e8; color: #fff; }
  .g-shop .btns, .g-life .btns { grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(0, 1fr); }
  .g-diary { grid-column: 1 / -1; flex-direction: row; align-items: center; }
  .g-diary h2 { flex: 0 0 auto; }
  .g-diary .btns { grid-template-columns: 1fr; }
  .btn { font-family: monospace; font-size: calc(clamp(13px, 1.8vw, 19px) * var(--scale)); line-height: 1.2; border: none; border-radius: 10px; padding: 4px; cursor: pointer; min-height: 0; overflow-wrap: anywhere; transition: transform .06s ease; }
  .btn.done { background: #1a73e8; color: #fff; }
  .btn.todo { background: #e0e0e0; color: #888; }
  .btn:active { transform: scale(.95); }
  #echo { background: #222; color: #fff; border-radius: 8px; padding: 6px 10px; font-size: clamp(11px, 1.4vw, 13px); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) {
    .groups { grid-template-columns: repeat(2, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; }
    .g-trip { grid-column: 1; grid-row: 1; }
    .g-shop { grid-column: 2; grid-row: 1; }
    .g-life { grid-column: 1; grid-row: 2; }
    .g-diary { grid-column: 2; grid-row: 2; flex-direction: column; align-items: stretch; }
  }
  @media (max-width: 560px) {
    .page { padding: 8px 8px 6px; gap: 6px; }
    .groups { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; }
    .g-trip { grid-column: 1; grid-row: 1; }
    .g-shop { grid-column: 1; grid-row: 2; }
    .g-life { grid-column: 1; grid-row: 3; }
    .g-diary { grid-column: 1; grid-row: 4; flex-direction: row; align-items: center; }
    .g-shop .btns { grid-template-columns: repeat(4, 1fr); }
    .g-life .btns { grid-template-columns: repeat(4, 1fr); }
    .scale input { width: 90px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Buttons</h1>
    <span class="legend"><b class="done">■ 彩色</b> 已做好　<b class="todo">■ 灰色</b> 还没做</span>
    <label class="scale">按钮大小 <input type="range" id="scale" min="70" max="150" value="100"> <span id="scaleVal">100%</span></label>
  </header>
  <main class="groups">
    <section class="group g-trip">
      <h2>出行</h2>
      <div class="btns">
        <button class="btn done go" id="goBtn">去上班 家→店</button>
        <div class="brow from"><span class="rowlabel">从</span>
          <button class="chip">家</button>
          <button class="chip">店</button>
          <button class="chip">Noodle Lab</button>
          <button class="chip">Biang</button>
          <button class="chip">Prisma Kaleva</button>
          <button class="chip">Bauhaus</button>
          <button class="chip">Hervanta Duo</button>
          <button class="chip">IKEA Tampere</button>
          <button class="chip">Verkkokauppa Pirkkala</button>
          <button class="chip">Kespro</button>
        </div>
        <div class="brow to"><span class="rowlabel">到</span>
          <button class="chip">家</button>
          <button class="chip">店</button>
          <button class="chip">Noodle Lab</button>
          <button class="chip">Biang</button>
          <button class="chip">Prisma Kaleva</button>
          <button class="chip">Bauhaus</button>
          <button class="chip">Hervanta Duo</button>
          <button class="chip">IKEA Tampere</button>
          <button class="chip">Verkkokauppa Pirkkala</button>
          <button class="chip">Kespro</button>
        </div>
      </div>
    </section>
    <section class="group g-shop">
      <h2>店里</h2>
      <div class="btns">
        <button class="btn done" id="radioBtn">听电台</button>
        <button class="btn todo">离开</button>
        <button class="btn todo">到了</button>
        <button class="btn todo">看店里</button>
        <button class="btn todo">今日营业额</button>
        <button class="btn todo">传发票</button>
        <button class="btn todo">拉 Lidl 小票</button>
      </div>
    </section>
    <section class="group g-life">
      <h2>生活</h2>
      <div class="btns">
        <button class="btn todo">推菜到小C</button>
        <button class="btn todo">选菜</button>
        <button class="btn todo">学芬兰语</button>
        <button class="btn done" id="sleepBtn">睡眠分析</button>
        <button class="btn todo">远程屏幕</button>
        <button class="btn todo">关显示器</button>
        <button class="btn todo">下 X 视频</button>
        <button class="btn todo">验登录</button>
      </div>
    </section>
    <section class="group g-diary">
      <h2>日记</h2>
      <div class="btns">
        <button class="btn done" id="diaryBtn">写日记</button>
      </div>
    </section>
  </main>
  <div id="echo">公交、电台、日记、睡眠能用了 · 其他按钮还在做</div>
</div>
<script>
  var SERVER = 'http://100.83.160.13:8765';
  var counts = {};
  document.querySelectorAll('.btn').forEach(function (b) {
    if (b.id) return;
    b.addEventListener('click', function () {
      var name = b.textContent.trim();
      counts[name] = (counts[name] || 0) + 1;
      document.getElementById('echo').textContent = '刚按了『' + name + '』· 第 ' + counts[name] + ' 下';
    });
  });
  document.getElementById('goBtn').addEventListener('click', function () {
    location.href = SERVER + '/bus/go';
  });
  document.getElementById('radioBtn').addEventListener('click', function () {
    location.href = SERVER + '/radio';
  });
  document.getElementById('diaryBtn').addEventListener('click', function () {
    location.href = SERVER + '/diary';
  });
  document.getElementById('sleepBtn').addEventListener('click', function () {
    location.href = SERVER + '/sleep';
  });
  var bus = { from: null, to: null };
  function busEcho() {
    var e = document.getElementById('echo');
    if (bus.from && bus.to) {
      e.textContent = '正在查 从 ' + bus.from + ' 到 ' + bus.to + '…';
      location.href = SERVER + '/bus?from=' + encodeURIComponent(bus.from) + '&to=' + encodeURIComponent(bus.to);
    }
    else if (bus.from) e.textContent = '从 ' + bus.from + ' 出发，选到哪里？';
    else if (bus.to) e.textContent = '到 ' + bus.to + '，从哪里出发？';
  }
  document.querySelectorAll('.brow.from .chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.brow.from .chip').forEach(function (x) { x.classList.remove('sel'); });
      c.classList.add('sel');
      bus.from = c.textContent.trim();
      busEcho();
    });
  });
  document.querySelectorAll('.brow.to .chip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('.brow.to .chip').forEach(function (x) { x.classList.remove('sel'); });
      c.classList.add('sel');
      bus.to = c.textContent.trim();
      busEcho();
    });
  });
  var slider = document.getElementById('scale');
  slider.addEventListener('input', function () {
    document.documentElement.style.setProperty('--scale', slider.value / 100);
    document.getElementById('scaleVal').textContent = slider.value + '%';
  });
</script>
</body>
</html>
