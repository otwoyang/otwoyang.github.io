<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>厨房看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #1a1a1a; color: #fff; padding: 12px; }
  h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: #ffd60a; }
  .sales-bar { text-align: center; font-size: 18px; margin-bottom: 12px; color: #30d158; font-weight: bold; }
  .status-bar { text-align: center; font-size: 12px; color: #888; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; }
  .btn-done { background: #30d158; color: #000; }
  .btn-back { background: #ff9f0a; color: #000; }
  .btn:disabled { opacity: 0.3; }
  .order { background: #2a2a2a; border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .order .info { flex: 1; }
  .order .num { font-size: 20px; font-weight: bold; color: #ffd60a; }
  .order .dish { font-size: 16px; margin: 4px 0; }
  .order .time { font-size: 13px; color: #888; }
  .order .amount { font-size: 20px; color: #30d158; font-weight: bold; }
  #setup { background: #2a2a2a; border-radius: 10px; padding: 20px; max-width: 400px; margin: 40px auto; }
  #setup input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #555; background: #1a1a1a; color: #fff; font-size: 15px; }
  #setup button { width: 100%; padding: 14px; background: #0a84ff; color: #fff; border: none; border-radius: 10px; font-size: 17px; margin-top: 10px; }
  .hidden { display: none; }
  #error { background: #ff453a; color: #fff; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; text-align: center; }
  .empty { text-align: center; color: #666; padding: 40px; font-size: 16px; }
</style>
</head>
<body>
<div id="setup">
  <h1>🍣 厨房看板设置</h1>
  <p style="color:#888;font-size:13px;margin-bottom:12px;">首次使用请输入 SumUp API Key（存本机浏览器，下次不用再输）</p>
  <input type="password" id="apiKey" placeholder="SumUp API Key">
  <button onclick="saveKey()">保存并开始</button>
  <p style="color:#666;font-size:11px;margin-top:12px;">🔒 Key 只存你 iPad 浏览器本地，网站是公开的但 key 是你自己输的，别人看不到。换浏览器/清数据要重输。</p>
</div>

<div id="board" class="hidden">
  <h1>🍣 厨房看板</h1>
  <div class="sales-bar" id="salesBar">今日销售额: €0.00</div>
  <div class="btn-row">
    <button class="btn btn-done" id="btnDone" onclick="markAllDone()">✅ 一键完成</button>
    <button class="btn btn-back" id="btnBack" onclick="restore()" disabled>↩️ 恢复</button>
  </div>
  <div class="status-bar" id="statusBar">加载中...</div>
  <div id="errorMsg"></div>
  <div id="orderList"></div>
</div>

<script>
const MERCHANT = 'MCTU2H9D';
const API_BASE = 'https://api.sumup.com/v2.1';
let apiKey = localStorage.getItem('sumup_kb_key') || '';
let currentOrders = [];
let stashedOrders = [];

if (apiKey) {
  showBoard();
} else {
  document.getElementById('setup').classList.remove('hidden');
}

function saveKey() {
  const k = document.getElementById('apiKey').value.trim();
  if (!k) { alert('请输入 API Key'); return; }
  apiKey = k;
  try { localStorage.setItem('sumup_kb_key', k); } catch(e) {}
  showBoard();
}

function showBoard() {
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('board').classList.remove('hidden');
  refresh();
  setInterval(refresh, 30000);
}

async function refresh() {
  const statusBar = document.getElementById('statusBar');
  try {
    const url = `${API_BASE}/merchants/${MERCHANT}/transactions/history?order=descending&limit=100`;
    const resp = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + apiKey }
    });
    if (!resp.ok) throw new Error('API ' + resp.status);
    const data = await resp.json();
    const items = data.items || [];
    
    const today = new Date().toISOString().split('T')[0];
    const todayItems = items.filter(t => {
      const d = new Date(t.timestamp);
      return d.toISOString().split('T')[0] === today && (t.status === 'SUCCESSFUL' || t.status === 'PAID');
    });

    if (stashedOrders.length === 0) {
      currentOrders = todayItems;
    }
    render();
    statusBar.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
    document.getElementById('errorMsg').innerHTML = '';
  } catch (e) {
    document.getElementById('errorMsg').innerHTML = '<div id="error">⚠️ 获取失败: ' + e.message + '</div>';
    statusBar.textContent = '获取失败，30秒后重试';
  }
}

function render() {
  const list = document.getElementById('orderList');
  const salesBar = document.getElementById('salesBar');
  
  let total = 0;
  currentOrders.forEach(t => { total += (t.amount || 0); });
  salesBar.textContent = '今日销售额: €' + total.toFixed(2) + ' (' + currentOrders.length + '单)';

  if (currentOrders.length === 0) {
    list.innerHTML = '<div class="empty">暂无待做订单 👨‍🍳</div>';
  } else {
    list.innerHTML = currentOrders.map(t => {
      const time = new Date(t.timestamp).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
      const amount = t.amount ? t.amount.toFixed(2) : '?';
      const products = (t.products || []).map(p => p.name).join(', ') || 'SumUp 订单';
      const code = t.transaction_code || t.id.slice(-6);
      return `<div class="order">
        <div class="info">
          <div class="num">#${code}</div>
          <div class="dish">${products}</div>
          <div class="time">${time}</div>
        </div>
        <div class="amount">€${amount}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('btnDone').disabled = currentOrders.length === 0;
  document.getElementById('btnBack').disabled = stashedOrders.length === 0;
}

function markAllDone() {
  if (currentOrders.length === 0) return;
  if (!confirm('把 ' + currentOrders.length + ' 个订单全部标记完成？')) return;
  stashedOrders = [...currentOrders];
  currentOrders = [];
  render();
}

function restore() {
  if (stashedOrders.length === 0) return;
  currentOrders = [...stashedOrders];
  stashedOrders = [];
  render();
}
</script>
</body>
</html>
