<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes · 数字世界地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; }
  header { background: #2c3e50; color: white; padding: 20px; }
  header a { color: #7fb3d5; text-decoration: none; font-size: 14px; }
  header h1 { font-size: 24px; margin: 8px 0 4px; }
  header p { opacity: 0.8; font-size: 14px; }
  main { max-width: 800px; margin: 20px auto; padding: 0 16px 40px; }
  section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h2 { font-size: 18px; margin-bottom: 12px; color: #2c3e50; }
  li { line-height: 1.8; margin-left: 20px; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>

<style>
  /* 我喜欢的风格设计 · 全站统一样式（2026-11-02）：只换样式，不改内容与功能 */
  body { background: #050505 !important; background-image: repeating-conic-gradient(#171717 0% 25%, #050505 0% 50%) !important; background-size: 24px 24px !important; color: #fff !important; }
  header { background: #050505 !important; border-bottom: 6px solid #20FF2F !important; color: #fff !important; }
  header a { color: #20FF2F !important; }
  header h1, header p { color: #fff !important; }
  main, .page { background: transparent !important; }
  section, .group, #setup { background: #050505 !important; border: 3px solid #20FF2F !important; border-radius: 2px !important; box-shadow: none !important; color: #fff !important; }
  h1, h2 { color: #20FF2F !important; }
  h2 { border-bottom: 2px solid #248C22 !important; padding-bottom: 6px !important; }
  a { color: #20FF2F !important; }
  code { background: #171717 !important; border: 1px solid #248C22 !important; color: #fff !important; }
  table, th, td { border-color: #248C22 !important; color: #fff !important; }
  th { background: #171717 !important; }
  .key { background: #171717 !important; border-left: 4px solid #20FF2F !important; color: #fff !important; }
  .warn { background: #171717 !important; border-left: 4px solid #20FF2F !important; color: #fff !important; }
  .status-ok { color: #20FF2F !important; }
  .legend, .rowlabel { color: #aaa !important; }
  .legend b.done { color: #20FF2F !important; }
  .btn.done, .chip.sel { background: #248C22 !important; color: #fff !important; }
  .btn.todo { background: #171717 !important; color: #888 !important; }
  .chip { background: #171717 !important; color: #fff !important; border: 1px solid #248C22 !important; }
  #echo { background: #171717 !important; border: 1px solid #248C22 !important; }
  .order { border: 3px solid #248C22 !important; }
</style>
</head>
<body>
<header>
  <a href="/">← 返回数字世界地图</a>
  <h1>📝 Notes</h1>
  <p>个人笔记系统（Memos），记录日常与工作</p>
</header>
<main>
  <section>
    <h2>📏 规则</h2>
    <ul>
      <li>用 ## 标签分类，子标签格式 <code>#父标签/子标签</code>（如 <code>#健康/太阳</code>）</li>
      <li>重要事项打 #todo</li>
      <li>Muse 通过 SSH 读写，自动整理</li>
    </ul>
  </section>
  <section>
    <h2>💾 数据文件</h2>
    <ul>
      <li>主库（Mac mini）：<code>~/Documents/Project-Notes/Data/memos_prod.db</code> (SQLite)</li>
    </ul>
  </section>
</main>
</body>
</html>
