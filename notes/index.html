<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes · 数字世界地图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #333; }
  header { background: #2c3e50; color: white; padding: 20px; }
  header a { color: #7fb3d5; text-decoration: none; font-size: 14px; }
  header h1 { font-size: 24px; margin: 8px 0 4px; }
  header p { opacity: 0.8; font-size: 14px; }
  main { max-width: 800px; margin: 20px auto; padding: 0 16px 40px; }
  section { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h2 { font-size: 18px; margin-bottom: 12px; color: #2c3e50; }
  li { line-height: 1.8; margin-left: 20px; }
  code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <a href="/">← 返回数字世界地图</a>
  <h1>📝 Notes</h1>
  <p>个人笔记系统（Memos），记录日常与工作</p>
</header>
<main>
  <section>
    <h2>📏 规则</h2>
    <ul>
      <li>用 ## 标签分类</li>
      <li>重要事项打 #todo</li>
      <li>Muse 可读写，自动整理</li>
    </ul>
  </section>
  <section>
    <h2>💾 数据文件</h2>
    <ul>
      <li>数据库：<code>~/workspace/memos/data/memos_prod.db</code> (SQLite)</li>
      <li>Mac 备份：<code>~/Documents/Project-Notes/Data/memos_prod.db</code></li>
      <li>共 70 条笔记</li>
    </ul>
  </section>
</main>
</body>
</html>
